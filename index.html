<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Mídia Indoor - Multi-Cliente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #config-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #fff; z-index: 10;
        }
        input, button { padding: 12px 20px; font-size: 18px; margin: 10px; border-radius: 5px; border: none; }
        input { width: 300px; text-align: center; }
        button { background: #28a745; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Tela de Configuração Inicial do Cliente -->
    <div id="config-screen">
        <h2>Configurar Player Mídia Indoor</h2>
        <p style="margin-bottom: 15px; color: #aaa;">Digite o identificador da pasta do cliente na VPS:</p>
        <input type="text" id="clienteInput" placeholder="Ex: cliente_joao" value="cliente_joao">
        <button onclick="iniciarPlayer()">Iniciar Player</button>
    </div>

    <!-- Elemento de Vídeo -->
    <video id="player" autoplay muted playsinline style="display:none;"></video>

    <script>
        // Simulando uma lista padrão ou busca dinâmica na pasta do cliente da VPS
        function iniciarPlayer() {
            const cliente = document.getElementById('clienteInput').value.trim();
            if(!cliente) {
                alert("Digite o nome da pasta do cliente!");
                return;
            }

            // Esconde a tela de config e mostra o vídeo
            document.getElementById('config-screen').style.display = 'none';
            const videoElement = document.getElementById('player');
            videoElement.style.display = 'block';

            // Playlist apontando direto para a estrutura da sua VPS
            // Na sua VPS (167.99.4.209), basta colocar os vídeos .mp4 nestas pastas via Termux/SSH
            const baseUrl = `http://167.99.4.209/${cliente}/videos/`;
            
            // Lista de arquivos da playlist do cliente
            const playlist = [
                baseUrl + "comercial1.mp4",
                baseUrl + "comercial2.mp4",
                baseUrl + "institucional.mp4"
            ];

            let currentIndex = 0;

            function playNext() {
                if (playlist.length === 0) return;
                videoElement.src = playlist[currentIndex];
                videoElement.load();
                videoElement.play().catch(e => {
                    console.log("Erro ao reproduzir, tentando próximo...", e);
                    proximoVideo();
                });
            }

            function proximoVideo() {
                currentIndex = (currentIndex + 1) % playlist.length;
                playNext();
            }

            videoElement.addEventListener('ended', proximoVideo);
            videoElement.addEventListener('error', () => {
                console.log("Erro no arquivo de vídeo, pulando...");
                setTimeout(proximoVideo, 2000);
            });

            playNext();
        }
    </script>
</body>
</html>
