<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Market - Player Mídia Indoor</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #config-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #fff; z-index: 10;
        }
        h1 { color: #00D2FF; margin-bottom: 5px; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
        p { margin-bottom: 15px; color: #aaa; }
        input, button { padding: 12px 20px; font-size: 18px; margin: 10px; border-radius: 5px; border: none; }
        input { width: 300px; text-align: center; background: #222; color: #fff; border: 1px solid #444; }
        button { background: #00D2FF; color: #000; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="config-screen">
        <h1>Audio Market</h1>
        <p>Digite o identificador da pasta do cliente na VPS:</p>
        <input type="text" id="clienteInput" placeholder="Ex: cliente_joao" value="cliente_joao">
        <button onclick="iniciarPlayer()">Iniciar Player</button>
    </div>
    <video id="player" autoplay muted playsinline style="display:none;"></video>
    <script>
        function iniciarPlayer() {
            const cliente = document.getElementById('clienteInput').value.trim();
            if(!cliente) { alert("Digite o nome da pasta do cliente!"); return; }
            document.getElementById('config-screen').style.display = 'none';
            const videoElement = document.getElementById('player');
            videoElement.style.display = 'block';
            const baseUrl = `http://167.99.4.209/${cliente}/videos/`;
            const playlist = [ baseUrl + "comercial1.mp4", baseUrl + "comercial2.mp4", baseUrl + "institucional.mp4" ];
            let currentIndex = 0;
            function playNext() {
                if (playlist.length === 0) return;
                videoElement.src = playlist[currentIndex];
                videoElement.load();
                videoElement.play().catch(e => { proximoVideo(); });
            }
            function proximoVideo() {
                currentIndex = (currentIndex + 1) % playlist.length;
                playNext();
            }
            videoElement.addEventListener('ended', proximoVideo);
            videoElement.addEventListener('error', () => { setTimeout(proximoVideo, 2000); });
            playNext();
        }
    </script>
</body>
</html>
